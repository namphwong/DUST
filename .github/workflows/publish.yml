name: AI CD - publish verified Docker Hub image
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Immutable image version, e.g. v1.0.0'
        required: true
        default: v1.0.0
      deploy_render:
        description: Deploy the pushed digest to the configured Render service
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: drawai-image-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release configuration
        env:
          VERSION: ${{ inputs.version }}
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test -n "$USERNAME" && test -n "$TOKEN" || { echo 'Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN first'; exit 1; }
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install numpy==1.26.4 Pillow==12.3.0 jsonschema==4.26.0
      - run: python tools/prepare_public_models.py fetch
      - name: Login without exposing credentials
        env:
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login --username "$USERNAME" --password-stdin
      - name: Build, test and publish the same image
        id: publish
        env:
          VERSION: ${{ inputs.version }}
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          IMAGE="$USERNAME/drawai-dinov3-api"
          docker build -f deployment/docker/Dockerfile --build-arg VCS_REF="$GITHUB_SHA" -t "$IMAGE:$VERSION" -t "$IMAGE:sha-$GITHUB_SHA" .
          docker run -d --name drawai-release --memory=512m --cpus=0.1 -p 127.0.0.1:10000:10000 "$IMAGE:$VERSION"
          python tools/smoke_public_api.py --url http://127.0.0.1:10000 --expected-revision "$GITHUB_SHA" --enforce-container-budget --output artifacts/drawai/cicd/release-smoke.json
          docker rm -f drawai-release
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          DIGEST=$(docker image inspect "$IMAGE:$VERSION" --format '{{index .RepoDigests 0}}')
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "$DIGEST" > artifacts/drawai/cicd/published-digest.txt
          # Pull with an empty Docker auth config to prove public visibility.
          ANON=$(mktemp -d)
          docker --config "$ANON" pull "$DIGEST"
          docker --config "$ANON" run -d --name drawai-public --memory=512m --cpus=0.1 -p 127.0.0.1:10000:10000 "$DIGEST"
          python tools/smoke_public_api.py --url http://127.0.0.1:10000 --expected-revision "$GITHUB_SHA" --enforce-container-budget --output artifacts/drawai/cicd/public-pull-smoke.json
          docker rm -f drawai-public
          echo "### Public Docker Hub image" >> "$GITHUB_STEP_SUMMARY"
          echo "https://hub.docker.com/r/$IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ai-publish-evidence
          path: artifacts/drawai/cicd/
          retention-days: 30
  render:
    if: inputs.deploy_render
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install numpy==1.26.4 Pillow==12.3.0 jsonschema==4.26.0
      - run: python tools/prepare_public_models.py fetch
      - name: Deploy exact digest and verify real inference
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          API_URL: ${{ vars.RENDER_API_URL }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          test -n "$HOOK" && test -n "$API_URL"
          curl --fail --silent --show-error --get --data-urlencode "imgURL=docker.io/$DIGEST" "$HOOK" > /dev/null
          python tools/smoke_public_api.py --url "$API_URL" --expected-revision "$GITHUB_SHA" --output artifacts/drawai/cicd/render-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ai-render-evidence
          path: artifacts/drawai/cicd/
          retention-days: 30
